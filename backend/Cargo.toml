[package]
name = "envibe"
version = "0.1.0"
edition = "2024"
description = "Multi-project development environment manager with TUI"
authors = ["Envibe Contributors"]

[dependencies]
# TUI
ratatui = "0.28"
crossterm = "0.28"

# Async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# HTTP Server (for Electron frontend)
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Docker
bollard = "0.18"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
anyhow = "1"
thiserror = "1"

# PTY for interactive agents
portable-pty = "0.8"

# Utilities
dirs = "5"
walkdir = "2"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }
